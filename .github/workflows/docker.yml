name: docker

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel on main or develop: those runs are the release evidence.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-image-changes: ${{ steps.image-changes.outputs.has-changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Branch protection requires compose-config on every PR. Only image builds
      # can be skipped when the merge commit leaves the image inputs untouched.
      - name: Detect image input changes
        id: image-changes
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: |
          changed_files=$(git diff --name-only HEAD^1 HEAD -- Dockerfile docker-bake.hcl docker/ \
            compose.yaml '.env.docker*' .github/workflows/docker.yml composer.json composer.lock \
            package.json package-lock.json vite.config.ts)
          if [[ -n "$changed_files" ]]; then
            echo 'has-changes=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare env
        run: |
          cp .env.docker.example .env
          php -r "file_put_contents('.env', preg_replace('/^APP_KEY=.*/m', 'APP_KEY=base64:'.base64_encode(random_bytes(32)), file_get_contents('.env')));"
      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet

  image-build:
    if: >-
      github.event_name != 'pull_request'
      || github.base_ref == 'main'
      || needs.compose-config.outputs.has-image-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: compose-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build development target
        run: docker build --target development -t instituta:dev .
      - name: Build production target
        run: docker build --target production -t instituta:prod .
      - name: Check production PHP platform
        run: docker run --rm --entrypoint composer instituta:prod check-platform-reqs --no-dev

  # arm64 needs QEMU emulation and costs ~39 billable minutes, so the full
  # linux/amd64,linux/arm64 manifest is baked on a release only: a v* tag, a
  # pull request that targets main, or a manual run. Every other push and pull
  # request is covered by image-build above, which builds linux/amd64.
  # GHCR publish stays maintainer-only on v* tags.
  multiarch-bake:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: image-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bake production (no push)
        run: docker buildx bake -f docker-bake.hcl production
