# qiick checks, from qiick-io/app-ui at the pinned release (docs/new-product.md).
# Bump the ref together with "ref" in qiick-standards.json and the @qiick URL in components.json.
name: qiick

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Never cancel on main or develop: those runs are the release evidence.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  app-ui-drift:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      standards: true

  php-quality:
    uses: qiick-io/app-ui/.github/workflows/php-quality.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  conformance:
    uses: qiick-io/app-ui/.github/workflows/conformance.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  ui-quality:
    uses: qiick-io/app-ui/.github/workflows/ui-quality.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      axe-test: tests/Browser/A11ySmokeBrowserTest.php

  migrations-frozen:
    uses: qiick-io/app-ui/.github/workflows/migrations-frozen.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0

  # create-project → instituta:install --no-interaction --force --no-npm → health → upgrade.
  # Verified locally when Actions minutes are exhausted; re-run on develop when CI returns.
  distribution-smoke:
    uses: qiick-io/app-ui/.github/workflows/app-distribution-smoke.yml@0d97ae1429a856411c76e6de1ec258cae0eabab6 # v0.15.0
    with:
      package: qiick/instituta-core
      command: instituta
      install-options: --no-interaction --force --no-npm
      upgrade-options: --no-interaction --force
