# Local / CI compose — builds the image (no GHCR pull).
# Usage:
#   cp .env.docker.example .env
#   # set APP_KEY
#   docker compose up --build -d
#
# Publishing images to GHCR is maintainer-only on a v* tag.

name: instituta

services:
  app:
    build:
      context: .
      target: production
    image: ${INSTITUTA_IMAGE:-instituta:prod}
    command: ["app"]
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      CACHE_CONFIG: "${CACHE_CONFIG:-true}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: log
    volumes:
      - instituta_storage:/var/www/html/storage
      - instituta_sqlite:/var/www/html/database
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  instituta_storage:
  instituta_sqlite:
